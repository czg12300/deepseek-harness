  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {

}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);

    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;

  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);

}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {

}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

  display: block;

  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;

      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)

}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

    min-height: 44px;
  }

  }

  }

    left: 50%;

    height: 44px;

  }

  }

  }

    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {

}

.text-warning,

  color: var(--destructive);

body10:{title:&#x27;第 10 章　失约的人&#x27;,label:&#x27;第 10 章 · 失约的人&#x27;,meta:&#x27;第一卷 · 雨夜来信&#x27;,paragraphs:[&#x27;茶楼快打烊了，对面的椅子始终空着。&#x27;,&#x27;伙计收走那只没动过的杯子，杯底露出一小片湿纸。没有落款，只有半个“渡”字。&#x27;,&#x27;沈砚把纸片收好。楼下有人撑开伞，伞沿刚好遮住了回头的脸。&#x27;],version:1},
body11:{title:&#x27;第 11 章　灯下旧伤&#x27;,label:&#x27;第 11 章 · 灯下旧伤&#x27;,meta:&#x27;第一卷 · 雨夜来信&#x27;,paragraphs:[&#x27;门闩落下时，沈砚才发现左手袖口已经湿透。&#x27;,&#x27;郎中剪开衣料，替他缠紧绷带。“左手腕这几日不能使劲。”&#x27;,&#x27;沈砚没有回答。他看着窗纸上的灯影，想起那张只写了半个字的纸。&#x27;],version:1},
body12:{title:&#x27;第 12 章　雨夜渡口&#x27;,label:&#x27;第 12 章 · 雨夜渡口&#x27;,meta:&#x27;第一卷 · 雨夜来信&#x27;,paragraphs:[&#x27;渡口只剩一盏灯。&#x27;,&#x27;沈砚停在石阶上。雨水顺着伞骨落下来，打湿了脚边的青苔。系船的木桩还在，绳子却断了，切口齐整，露出一截浅白的芯。&#x27;,&#x27;船夫蹲在灯下，听见脚步也没有抬头。\n“末班船走了。”\n“我找的不是船。”&#x27;,&#x27;沈砚把纸片放在木箱上。船夫看见那个字，手指停了一瞬。&#x27;,&#x27;他用右手抬起箱角，左腕仍隐隐作痛。压在箱底的密信终于露了出来。&#x27;,&#x27;信封没有封口。沈砚展开信纸，上面只写着一句话：今夜来的人，不该是你。&#x27;],version:1},
outline:{title:&#x27;第一卷　雨夜来信&#x27;,label:&#x27;第一卷 · 故事大纲&#x27;,meta:&#x27;分卷大纲 · 第 12—15 章&#x27;,paragraphs:[&#x27;第 12 章 · 雨夜渡口\n沈砚到达渡口，发现密信。信上的话暗示，他并非原定的收信人。&#x27;,&#x27;第 13 章 · 信中之人\n第三人来到渡口索要密信，向沈砚解释自己与写信人的关系。&#x27;,&#x27;第 14 章 · 第二枚印章\n新的证据指向旧友，沈砚对旧友的信任开始动摇。&#x27;,&#x27;第 15 章 · 不见天日的房间\n纸片上的半个“渡”字有了新的解释，调查进入下一阶段。&#x27;],version:1},
character:{title:&#x27;沈砚&#x27;,label:&#x27;人物设定 · 沈砚&#x27;,meta:&#x27;主角 · 截至第 12 章&#x27;,paragraphs:[&#x27;人物性格\n寡言，观察细致，不愿欠人情。面对危险时习惯独自处理。&#x27;,&#x27;当前状态\n身在城南渡口，左腕受伤，暂时不能使劲。&#x27;,&#x27;人物目标\n找到失踪的送信人，查明密信的来源。&#x27;,&#x27;已知与未知\n知道纸片与渡口有关；尚不知道写信人的身份，也不知道旧友参与了送信。&#x27;,&#x27;说话方式\n短句，少解释。紧张时通常沉默。&#x27;],version:1}
