lex;align-items:center;gap:9px;padding:9px 10px;color:#767c85;font-size:13px;border-radius:7px}#nw .navitem.active{background:var(--nw-selected);color:var(--nw-blue)}#nw .sectionlabel{font-size:12px;color:#9298a2;margin:23px 9px 10px}#nw .book{display:flex;gap:7px;align-items:center;font-size:13px;padding:7px 9px}#nw .book svg{color:var(--nw-blue);width:16px;height:16px}#nw .volume{font-size:11px;color:#989ea8;margin:12px 11px 6px}#nw .chapter{display:flex;justify-content:flex-start;gap:6px;border:0;background:transparent;font-size:12px;text-align:left;width:100%;padding:8px 9px;border-radius:6px;margin:3px 0}#nw .chapter.active{background:#ebedf1;color:#333943}#nw .chapter span:first-child{color:#979da7;font-size:11px;font-variant-numeric:tabular-nums}#nw .settings{margin-top:auto;padding-top:45px}#nw .appmain{min-width:0}#nw .projectbar{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:9px;padding:15px 22px;border-bottom:1px solid var(--nw-border);flex-wrap:wrap}#nw .crumb{display:flex;align-items:center;gap:10px;font-size:13px}#nw .crumb span:first-child{color:var(--nw-muted)}#nw .crumb .slash{color:#c5c8cd}#nw .projectbar .muted{font-size:11px}#nw .workarea{display:grid;grid-template-columns:minmax(0,1fr) 292px;min-height:674px}#nw .content{min-width:0;display:flex;flex-direction:column;background:#fff}#nw .tabs{padding:0 21px;display:flex;align-items:center;gap:22px;border-bottom:1px solid var(--nw-border);min-height:47px}#nw .tabs button{background:transparent;border:0;border-radius:0;padding:13px 0 10px;font-size:13px;color:#8a909a}#nw .tabs button.active{border-bottom:2px solid var(--nw-blue);color:var(--nw-blue)}#nw .editorbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:13px 22px;font-size:12px;color:#818997}#nw .editorbar button{font-size:12px;padding:5px 7px}#nw .badge{font-size:11px;background:#f2f4f7;color:#7f8791;border-radius:4px;padding:2px 6px}#nw .page{padding:16px 31px 28px;min-width:0;flex:1}#nw .chaptermeta{font-size:11px;color:#969ca6;display:flex;gap:12px;flex-wrap:wrap;margin:9px 0 25px}#nw .prose{font-size:15px;line-height:1.95;color:#3c414a}#nw .prose p{margin:0 0 18px;white-space:pre-wrap;overflow-wrap:anywhere}#nw .prose .bodyparagraph{text-indent:2em}#nw .edit-area{min-height:370px;margin:15px 0;font-size:15px;line-height:1.95}#nw .docfoot{border-top:1px solid var(--nw-border);padding:11px 22px;display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#9299a3;flex-wrap:wrap}#nw .reviewbar{padding:12px 18px;background:#f2f6ff;border-bottom:1px solid #e2eaff;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:#4b638f}#nw .reviewbar button{font-size:12px;padding:5px 9px}#nw .diff{border:1px solid #dbe6ff;border-radius:7px;overflow:hidden;margin:0 0 20px;font-size:14px;line-height:1.9;text-indent:0}#nw .diff-title{font-size:11px;color:#7290bf;padding:7px 12px;background:#f7faff;border-bottom:1px solid #e7eefb}#nw .removed{background:#fff5f3;padding:12px 14px;color:#a7675b;white-space:pre-wrap}#nw .added{background:#f0f8f2;padding:12px 14px;color:#365f47;white-space:pre-wrap}#nw .diff .prefix{font-size:11px;margin-right:7px;opacity:.8}#nw .agent{border-left:1px solid var(--nw-border);background:#fff;min-width:0;display:flex;flex-direction:column}#nw .agent-head{min-height:47px;border-bottom:1px solid var(--nw-border);padding:10px 15px;display:flex;justify-content:space-between;align-items:center;gap:8px}#nw .agent-head strong{font-size:13px;font-weight:500}#nw .agent-head button{padding:2px 5px;color:#89909a}#nw .agent-head svg{width:15px;height:15px}#nw .agent-context{padding:12px 15px;border-bottom:1px solid #f0f1f4;background:#fafbfd;display:flex;gap:7px;align-items:center;font-size:11px;color:#7e899b}#nw .agent-context svg{width:13px;height:13px;color:var(--nw-blue);flex-shrink:0}#nw .chat{padding:19px 16px 15px;flex:1;min-height:315px}#nw .message{font-size:13px;line-height:1.8;overflow-wrap:anywhere;white-space:pre-wrap;margin-bottom:22px}#nw .message.assistant{color:#565e6a}#nw .message.user{padding:10px 12px;background:#edf3ff;border-radius:12px 12px 3px 12px;margin-left:21px;color:#424e65}#nw .message-name{display:flex;align-items:center;gap:6px;font-size:11px;color:#939ba7;margin-bottom:9px}#nw .message-name svg{width:13px;height:13px;color:#7e93b9}#nw .proposal-link{border:1px solid #e3e9f3;border-radius:7px;padding:11px 12px;margin:12px 0 0;white-space:normal;background:#fafcff;font-size:12px}#nw .proposal-link button{font-size:11px;color:var(--nw-blue);margin-top:5px;padding:3px 0;border:0;background:transparent}#nw .suggestions{display:flex;flex-wrap:wrap;gap:7px;margin-top:17px}#nw .suggestions button{font-size:11px;padding:6px 9px;text-align:left;color:#788393;background:#fff;border-color:#e6e9ef}#nw .compose{padding:12px 13px 13px;border-top:1px solid #f0f1f4;background:#fff}#nw .composer{border:1px solid #e0e4eb;border-radius:12px;padding:11px;background:#fff;box-shadow:0 3px 12px #202d4c05}#nw .composer textarea{border:0;padding:0;font-size:13px;min-height:78px;line-height:1.7;resize:vertical}#nw .composer textarea:focus{outline:none}#nw .sendbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px}#nw .sendbar span{font-size:11px;color:#99a1ac}#nw .sendbar button{width:29px;min-height:29px;padding:4px;border-radius:50%}#nw .composehint{font-size:10px;color:#a0a6af;margin-top:9px;text-align:center}#nw .bottom-status{font-size:11px;color:#969ca6;padding:8px 15px;border-top:1px solid var(--nw-border);background:#fff}#nw .empty{font-size:13px;line-height:1.9;color:#8993a2;padding-top:20px}#nw .listsection{margin:23px 0}#nw .listsection h3{font-size:14px;color:#39404b;margin-bottom:7px}#nw .listsection p{font-size:14px;line-height:1.9;color:#69717d}#nw[data-collapsed=true] .shell{grid-template-columns:minmax(0,1fr)}#nw[data-collapsed=true] .sidebar{display:none}
#nw [hidden]{display:none!important}
@media(max-width:1000px){#nw .shell{grid-template-columns:164px minmax(0,1fr)}#nw .workarea{grid-template-columns:minmax(0,1fr) 267px}#nw .page{padding:15px 23px 25px}#nw .projectbar{padding:14px 20px}}

</style>
<div id="nw" aria-label="小说创作页：中间内容编辑，右侧 AI Agent 聊天" data-collapsed="false">

      <div class="workarea">
        <main class="content" aria-label="中间内容编辑区"><nav class="tabs" aria-label="编辑内容类型"><button type="button" class="active cursor-interaction" data-view="body" aria-pressed="true">正文</button><button type="button" class="cursor-interaction" data-view="outline" aria-pressed="false">大纲</button><button type="button" class="cursor-interaction" data-view="character" aria-pressed="false">人物设定</button></nav><div class="editorbar"><div class="row"><span id="nw-docname">第 12 章 · 雨夜渡口</span><span class="badge" id="nw-version">草稿 v1</span></div><div class="row"><button type="button" class="ghost cursor-interaction" data-action="undo" id="nw-undo" disabled aria-label="撤销最近一次内容修改"><i data-lucide="undo-2" aria-hidden="true"></i></button><button type="button" class="ghost cursor-interaction" data-action="edit" id="nw-edit"><i data-lucide="pencil" aria-hidden="true"></i>编辑</button></div></div><div id="nw-review"></div><div class="page" id="nw-page"></div><div class="docfoot"><span id="nw-wordcount"></span><span>支持手动编辑和 AI 修改</span></div></main>

<script>
(()=>{
const root=document.getElementById('nw');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const docs={
body10:{title:'第 10 章　失约的人',label:'第 10 章 · 失约的人',meta:'第一卷 · 雨夜来信',paragraphs:['茶楼快打烊了，对面的椅子始终空着。','伙计收走那只没动过的杯子，杯底露出一小片湿纸。没有落款，只有半个“渡”字。','沈砚把纸片收好。楼下有人撑开伞，伞沿刚好遮住了回头的脸。'],version:1},
body11:{title:'第 11 章　灯下旧伤',label:'第 11 章 · 灯下旧伤',meta:'第一卷 · 雨夜来信',paragraphs:['门闩落下时，沈砚才发现左手袖口已经湿透。','郎中剪开衣料，替他缠紧绷带。“左手腕这几日不能使劲。”','沈砚没有回答。他看着窗纸上的灯影，想起那张只写了半个字的纸。'],version:1},
body12:{title:'第 12 章　雨夜渡口',label:'第 12 章 · 雨夜渡口',meta:'第一卷 · 雨夜来信',paragraphs:['渡口只剩一盏灯。','沈砚停在石阶上。雨水顺着伞骨落下来，打湿了脚边的青苔。系船的木桩还在，绳子却断了，切口齐整，露出一截浅白的芯。','船夫蹲在灯下，听见脚步也没有抬头。\n“末班船走了。”\n“我找的不是船。”','沈砚把纸片放在木箱上。船夫看见那个字，手指停了一瞬。','他用右手抬起箱角，左腕仍隐隐作痛。压在箱底的密信终于露了出来。','信封没有封口。沈砚展开信纸，上面只写着一句话：今夜来的人，不该是你。'],version:1},
outline:{title:'第一卷　雨夜来信',label:'第一卷 · 故事大纲',meta:'分卷大纲 · 第 12—15 章',paragraphs:['第 12 章 · 雨夜渡口\n沈砚到达渡口，发现密信。信上的话暗示，他并非原定的收信人。','第 13 章 · 信中之人\n第三人来到渡口索要密信，向沈砚解释自己与写信人的关系。','第 14 章 · 第二枚印章\n新的证据指向旧友，沈砚对旧友的信任开始动摇。','第 15 章 · 不见天日的房间\n纸片上的半个“渡”字有了新的解释，调查进入下一阶段。'],version:1},
character:{title:'沈砚',label:'人物设定 · 沈砚',meta:'主角 · 截至第 12 章',paragraphs:['人物性格\n寡言，观察细致，不愿欠人情。面对危险时习惯独自处理。','当前状态\n身在城南渡口，左腕受伤，暂时不能使劲。','人物目标\n找到失踪的送信人，查明密信的来源。','已知与未知\n知道纸片与渡口有关；尚不知道写信人的身份，也不知道旧友参与了送信。','说话方式\n短句，少解释。紧张时通常沉默。'],version:1}
};
const state={view:'body',chapter:12,collapsed:false,editing:false,prompt:'',pending:null,history:{},messages:[],lastApplied:null};let lastSnapshot='';
const key=()=>state.view==='body'?'body'+state.chapter:state.view;
const icon=()=>{if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}})};
const notify=t=>{root.querySelector('#nw-status').textContent=t};
function persist(){if(!window.openai?.setWidgetState)return;const privateContent={kind:'novel-writing-v1',view:state.view,chapter:state.chapter,docs:Object.fromEntries(Object.entries(docs).map(([k,d])=>[k,{paragraphs:d.paragraphs,version:d.version}])),messages:state.messages.slice(-4)};if(new TextEncoder().encode(JSON.stringify(privateContent)).length>14000)return;lastSnapshot=JSON.stringify(privateContent);window.openai.setWidgetState({modelContent:{module:'小说创作页',content:state.view,lastApplied:state.lastApplied},privateContent}).catch(()=>{})}
function restore(s){const p=s?.privateContent;if(p?.kind!=='novel-writing-v1')return;if(['body','outline','character'].includes(p.view))state.view=p.view;if([10,11,12].includes(p.chapter))state.chapter=p.chapter;for(const [k,d] of Object.entries(p.docs||{})){if(docs[k]&&Array.isArray(d.paragraphs)&&d.paragraphs.every(t=>typeof t==='string')&&d.paragraphs.join('').length<6000){docs[k].paragraphs=d.paragraphs;docs[k].version=Number(d.version)||1}}if(Array.isArray(p.messages))state.messages=p.messages.filter(m=>m&&['user','assistant'].includes(m.role)&&typeof m.text==='string').slice(-4)}
function render(){const d=docs[key()];root.dataset.collapsed=String(state.collapsed);root.querySelector('#nw-expand').hidden=!state.collapsed;root.querySelector('#nw-chapters').innerHTML=[10,11,12].map(n=>`<button type="button" class="chapter cursor-interaction ${state.chapter===n&&state.view==='body'?'active':''}" data-chapter="${n}" aria-pressed="${state.chapter===n&&state.view==='body'}"><span>${n}</span>${{10:'失约的人',11:'灯下旧伤',12:'雨夜渡口'}[n]}</button>`).join('');root.querySelectorAll('[data-view]').forEach(b=>{const active=b.dataset.view===state.view;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});root.querySelector('#nw-docname').textContent=d.label;root.querySelector('#nw-version').textContent='草稿 v'+d.version;root.querySelector('#nw-context').textContent='当前内容：'+(state.view==='body'?'正文 / 第 '+state.chapter+' 章':d.label);root.querySelector('#nw-scope').textContent=state.view==='body'?'修改当前章节':'修改当前'+(state.view==='outline'?'大纲':'人物设定');root.querySelector('#nw-edit').disabled=Boolean(state.pending);root.querySelector('#nw-undo').disabled=!(state.history[key()]?.length)||Boolean(state.pending)||state.editing;renderPage();renderChat();icon()}
function renderPage(){const d=docs[key()],p=state.pending&&state.pending.key===key()?state.pending:null;root.querySelector('#nw-review').innerHTML=p?`<div class="reviewbar"><span>AI 修改建议 · 1 处待处理</span><div class="row"><button type="button" class="cursor-interaction" data-action="discard">放弃</button><button type="button" class="primary cursor-interaction" data-action="apply">应用修改</button></div></div>`:'';root.querySelector('#nw-page').innerHTML=`<h1>${esc(d.title)}</h1><div class="chaptermeta"><span>${esc(d.meta)}</span><span>${state.view==='body'?'视角：沈砚':'与正文关联保存'}</span></div>${state.editing?`<textarea class="edit-area" id="nw-manual" aria-label="手动编辑当前内容" maxlength="6000">${esc(d.paragraphs.join('\n\n'))}</textarea><div class="row"><button type="button" class="primary cursor-interaction" data-action="save-manual">保存修改</button><button type="button" class="cursor-interaction" data-action="cancel-manual">取消</button></div>`:`<article class="prose">${d.paragraphs.map((text,i)=>p&&i===p.index?`<div class="diff"><div class="diff-title">修改对比</div><div class="removed"><span class="prefix">− 原文</span>${esc(text)}</div><div class="added"><span class="prefix">+ 建议</span>${esc(p.after)}</div></div>`:`<p class="${state.view==='body'?'bodyparagraph':''}">${esc(text)}</p>`).join('')}</article>`}`;root.querySelector('#nw-wordcount').textContent=d.paragraphs.join('').replace(/\s/g,'').length+' 字 · '+(state.editing?'手动编辑中':p?'原稿尚未变更':state.view==='body'?'正文节选':'内容预览')}
function renderChat(){let welcome=state.view==='body'?'我已关联当前章节。你可以让我调整情节、润色段落，或改写结尾。修改建议会显示在中间的正文里，由你决定是否应用。':state.view==='outline'?'当前关联第一卷大纲。你可以调整章节节奏、安排冲突，或推迟某个秘密的揭示。':'当前关联沈砚的人物设定。你可以补充动机、调整性格或修改说话方式。';const suggestions=state.view==='body'?['让结尾更有悬念','精简环境描写']:state.view==='outline'?['推迟揭晓写信人身份','让冲突推进更紧凑']:['让人物更有主动性','调整人物说话方式'];root.querySelector('#nw-chat').innerHTML=`<div class="message assistant"><div class="message-name"><i data-lucide="sparkles" aria-hidden="true"></i>AI Agent</div>${welcome}</div>${state.messages.map(m=>`<div class="message ${m.role}">${m.role==='assistant'?'<div class="message-name">AI Agent</div>':''}${esc(m.text)}${m.proposal&&state.pending&&m.proposal===state.pending.id?`<div class="proposal-link"><div>${esc(docs[state.pending.key].label)}</div><div class="muted">1 处修改 · 等待应用</div><button type="button" class="cursor-interaction" data-action="locate">查看中间的修改建议 ←</button></div>`:''}</div>`).join('')}${state.messages.length?'':`<div class="suggestions">${suggestions.map(s=>`<button type="button" class="cursor-interaction" data-prompt="${esc(s)}">${esc(s)}</button>`).join('')}</div>`}`;const input=root.querySelector('#nw-prompt');input.value=state.prompt;const locked=Boolean(state.pending)||state.editing;input.disabled=locked;root.querySelector('#nw-send').disabled=locked;root.querySelector('#nw-hint').textContent=state.pending?'请先应用或放弃中间的修改建议':state.editing?'请先保存或取消手动编辑':'Enter 发送 · Shift + Enter 换行';icon()}
function send(q){if(state.pending){notify('请先应用或放弃当前修改建议');return}if(state.editing){notify('请先保存手动修改');return}const request=(q||state.prompt).trim();if(!request)return;state.messages.push({role:'user',text:request});state.prompt='';if(/为什么|你觉得|有什么建议|怎么写/.test(request)){state.messages.push({role:'assistant',text:'可以先保留人物动作与已知事实，再调整信息出现的顺序。例如，先写船夫看到纸片后的停顿，让读者感到他有所隐瞒。你也可以直接说“让结尾更有悬念”，查看修改对比。'});state.messages=state.messages.slice(-6);renderChat();persist();return}const k=key(),d=docs[k];let index,after,reply;if(state.view==='outline'){index=Math.min(1,d.paragraphs.length-1);after='第 13 章 · 信中之人\n第三人来到渡口索要密信，却拒绝解释与写信人的关系。沈砚注意到他认得信封上的旧印章，决定隐瞒自己已经读过信。把身份解释留到后续章节。';reply='我把第 13 章的身份解释延后，改为通过旧印章留下线索，同时让沈砚做出主动选择。'}else if(state.view==='character'){if(/说话|对白|语气/.test(request)){index=d.paragraphs.length-1;after='说话方式\n习惯短句，少解释。紧张时反而更客气，常用反问试探对方；面对信任的人，偶尔会说一句干冷的笑话。';reply='我补充了人物在不同关系和压力下的说话方式。'}else{index=Math.min(2,d.paragraphs.length-1);after='人物目标\n主动追查送信人的下落。面对可疑人物时，会先设计试探、核对说法，再决定是否透露自己掌握的线索。';reply='我把“寻找真相”的目标补成了可执行的行动，让他更主动地推动调查。'}}else if(/环境|精简|简短|简洁/.test(request)){index=Math.min(1,d.paragraphs.length-1);after=state.chapter===12?'沈砚停在石阶上。木桩上的绳子断了，切口很新。':state.chapter===11?'郎中缠紧绷带。“左手腕这几日不能使劲。”':'伙计收走杯子，露出一张纸片。没有落款，只有半个“渡”字。';reply='我压缩了这段描写，保留推动情节的细节。其他段落保持原稿。'}else{index=d.paragraphs.length-1;after=state.chapter===12?'沈砚展开信纸。\n上面只写着一句话：今夜来的人，不该是你。\n他还没来得及抬头，身后的船夫忽然吹灭了灯。':state.chapter===11?'沈砚望着窗纸上的灯影。门外有人停住脚步，轻轻敲了三下——正是失踪的送信人与他约定的暗号。':'沈砚收好纸片，楼下的人却忽然抬起伞。那张脸，他昨天刚在失踪告示上见过。';reply='我在结尾补了一个当场发生的变化，保留密信与人物身份的疑问。修改对比已放在中间。'}if(after===d.paragraphs[index]){state.messages.push({role:'assistant',text:'当前内容已经采用了这段示例修改。可以切换内容或试试另一种修改要求。'});renderChat();return}state.pending={id:'proposal-'+Date.now(),key:k,index,before:d.paragraphs[index],after,version:d.version};state.messages.push({role:'assistant',text:reply,proposal:state.pending.id});state.messages=state.messages.slice(-6);render();notify('已展示预置改稿示例 · 对比原文后，可应用或放弃')}
function switchView(view,chapter){if(state.editing){notify('请先保存或取消手动编辑');return}state.view=view;if(chapter)state.chapter=chapter;render();persist()}
function apply(){const p=state.pending;if(!p)return;const d=docs[p.key];if(d.version!==p.version||d.paragraphs[p.index]!==p.before){notify('原稿已变化，请放弃当前建议后重新提出修改要求');return}(state.history[p.key]??=[]).push([...d.paragraphs]);d.paragraphs[p.index]=p.after;d.version++;state.lastApplied=d.label;state.messages.push({role:'assistant',text:'已应用到“'+d.label+'”。你可以继续提出修改要求，也可以在中间工具栏撤销这次修改。'});state.messages=state.messages.slice(-6);state.pending=null;root.querySelector('#nw-save').textContent='修改已保存';render();notify('示例修改已应用到中间内容 · 尚未写入真实小说文件');persist()}
root.addEventListener('input',e=>{if(e.target.id==='nw-prompt')state.prompt=e.target.value});root.querySelector('#nw-prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;if(b.dataset.view){switchView(b.dataset.view);return}if(b.dataset.chapter){switchView('body',Number(b.dataset.chapter));return}if(b.dataset.prompt){send(b.dataset.prompt);return}switch(b.dataset.action){case'collapse':state.collapsed=!state.collapsed;root.dataset.collapsed=String(state.collapsed);root.querySelector('#nw-expand').hidden=!state.collapsed;break;case'send':send();break;case'apply':apply();break;case'discard':state.pending=null;state.messages.push({role:'assistant',text:'已放弃这次修改，原稿保留。你可以换个方向继续调整。'});render();notify('已放弃修改建议 · 原稿未变');break;case'locate':if(state.pending){const k=state.pending.key;state.view=k.startsWith('body')?'body':k;if(k.startsWith('body'))state.chapter=Number(k.slice(4));render()}break;case'edit':if(state.pending)return;state.editing=true;render();break;case'cancel-manual':state.editing=false;render();break;case'save-manual':{const v=root.querySelector('#nw-manual').value.trim();if(!v){notify('内容不能为空');return}const k=key(),d=docs[k];(state.history[k]??=[]).push([...d.paragraphs]);d.paragraphs=v.split(/\n\s*\n/);d.version++;state.editing=false;root.querySelector('#nw-save').textContent='修改已保存';render();persist();notify('手动修改已保存在当前原型中');break}case'undo':{const old=state.history[key()]?.pop();if(old){docs[key()].paragraphs=old;docs[key()].version++;render();notify('已恢复上一次内容');persist()}break}case'newchat':if(state.pending){notify('请先处理当前修改建议，再开始新对话');return}state.messages=[];state.prompt='';renderChat();persist();notify('已开始新的示例对话，当前正文保留');break}});
restore(window.openai?.widgetState);render();window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState;if(!s||JSON.stringify(s.privateContent)===lastSnapshot)return;restore(s);render()});
})();
</script>
