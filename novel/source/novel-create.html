<style>
#np{color-scheme:light;--np-bg:#fff;--np-side:#f8f9fb;--np-text:#24272c;--np-muted:#818690;--np-border:#e9eaee;--np-blue:#4c7dff;--np-selected:#edf2ff;--np-hover:#f2f4f7;--np-error:#bd3d3d;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;color:var(--np-text);background:var(--np-bg);border:1px solid var(--np-border);border-radius:9px;overflow:clip;text-align:left}
#np *{box-sizing:border-box}#np button,#np input,#np textarea{font:inherit;color:inherit}#np button{display:inline-flex;justify-content:center;align-items:center;gap:7px;border:1px solid var(--np-border);background:var(--np-bg);padding:8px 15px;border-radius:8px;white-space:normal}#np button:hover{background:var(--np-hover)}#np button.primary{background:var(--np-blue);border-color:var(--np-blue);color:#fff}#np button.primary:hover{background:#3d6fed}#np button:disabled{opacity:.45;cursor:default}#np button.ghost{background:transparent;border-color:transparent;padding:6px}#np button svg,#np .navitem svg,#np .pathline svg{flex-shrink:0;width:16px;height:16px}#np input,#np textarea{width:100%;padding:11px 13px;border:1px solid #dfe2e8;border-radius:8px;background:var(--np-bg);font-size:15px;line-height:1.6}#np input::placeholder,#np textarea::placeholder{color:#a4a9b2}#np input:focus,#np textarea:focus{outline:2px solid #dce7ff;border-color:#88a7ff}#np textarea{resize:vertical;min-height:118px}#np h1{font-size:23px;line-height:1.4;font-weight:500;margin:0 0 8px}#np h2{font-size:18px;font-weight:500;margin:0 0 9px}#np h3{font-size:16px;font-weight:500;margin:0}#np p{margin:0}#np .small{font-size:12px}#np .muted{color:var(--np-muted)}#np .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}#np .between{justify-content:space-between}#np .layout{display:grid;grid-template-columns:188px minmax(0,1fr);min-height:700px}#np .sidebar{background:var(--np-side);border-right:1px solid var(--np-border);padding:19px 12px;display:flex;flex-direction:column}#np .brand{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 5px 20px}#np .brandname{font-size:14px;font-weight:500;line-height:1.4}#np .build{font:9px/1.4 ui-monospace,SFMono-Regular,monospace;color:#fff;background:#2b2e33;border-radius:2px;padding:1px 3px;display:inline-block;letter-spacing:.01em}#np .new-session{width:100%;margin-bottom:15px;height:39px;background:var(--np-bg);border:1px solid var(--np-border);border-radius:9px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px}#np .new-session svg{width:16px;height:16px}#np .navitem{display:flex;align-items:center;gap:9px;padding:9px 10px;font-size:13px;color:#767c85;border-radius:7px}#np button.navitem{justify-content:flex-start;width:100%;border:0}#np .navitem.selected{background:var(--np-selected);color:var(--np-blue)}#np .workspace-title{margin:19px 5px 12px;display:flex;align-items:center;justify-content:space-between;color:#9298a2;font-size:12px}#np .workspace-title svg{width:14px;height:14px}#np .foldername{font-size:12px;padding:7px 9px;display:flex;gap:7px;align-items:center}#np .foldername svg{width:15px;height:15px;color:var(--np-blue)}#np .sessionname{padding:7px 8px 7px 24px;font-size:11px;display:flex;justify-content:space-between;gap:5px;color:#757b85}#np .settings{margin-top:auto;padding-top:45px}#np .main{min-width:0;position:relative}#np .header{min-height:65px;border-bottom:1px solid var(--np-border);padding:14px 27px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}#np .crumb{display:flex;align-items:center;gap:12px;font-size:14px}#np .crumb .sep{color:#c5c8cd}#np .prototype{font-size:11px;color:#979ca5}#np .header button{font-size:13px;padding:7px 12px}#np .formwrap{max-width:602px;margin:0 auto;padding:42px 30px 44px}#np .intro{font-size:13px;color:var(--np-muted);margin-top:8px;margin-bottom:29px}#np .field{display:block;margin-bottom:24px}#np .field-label{display:block;font-size:13px;font-weight:500;margin-bottom:9px}#np .pathcontrol{display:flex;align-items:center;gap:8px;border:1px solid #dfe2e8;padding:6px 7px 6px 12px;border-radius:8px;min-height:46px}#np .pathcontrol>svg{width:17px;height:17px;color:#8b929c;flex-shrink:0}#np .pathvalue{min-width:0;flex:1;font-size:12px;overflow-wrap:anywhere}#np .pathcontrol button{font-size:12px;padding:5px 9px;flex-shrink:0}#np .helper{font-size:12px;color:var(--np-muted);margin-top:9px}#np .destination{margin-top:13px;background:#f8f9fb;padding:12px 14px;border-radius:7px;font-size:12px;color:#737b88;overflow-wrap:anywhere}#np .destination strong{font-weight:500;color:#484f5b}#np .actions{display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--np-border);padding-top:21px;margin-top:30px}#np .error{font-size:12px;color:var(--np-error);margin:12px 0}#np .library{padding:30px 27px 40px}#np .library-title{display:flex;align-items:baseline;gap:10px;margin-bottom:25px}#np .library-title h1{font-size:20px;margin:0}#np .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}#np .novelcard{border:1px solid var(--np-border);border-radius:11px;padding:22px 21px;background:#fff;display:flex;flex-direction:column;min-width:0}#np .novelcard>button{justify-content:flex-start;background:transparent;border:0;padding:0;text-align:left;font-size:16px;font-weight:500;margin-bottom:12px;align-self:flex-start}#np .novelcard>button:hover{color:var(--np-blue)}#np .novelcard>button svg{color:var(--np-blue);width:18px;height:18px}#np .synopsis{font-size:13px;line-height:1.8;color:#777e89;min-height:70px;margin-bottom:20px;overflow-wrap:anywhere}#np .pathline{display:flex;gap:6px;font-size:11px;color:#9298a1;align-items:flex-start;margin-top:auto;overflow-wrap:anywhere}#np .pathline svg{width:13px;height:13px;margin-top:3px}#np .cardfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:#9097a0;border-top:1px solid #f0f1f4;margin-top:15px;padding-top:12px}#np .cardfoot button{font-size:11px;padding:3px 7px;border:0;color:var(--np-blue);background:transparent}#np .success{display:flex;align-items:center;gap:8px;color:#327051;background:#eff8f2;padding:11px 14px;border-radius:7px;font-size:13px;margin-bottom:22px}#np .success svg{width:16px;height:16px}#np .pickbox{border:1px solid #dfe2e8;background:#fafbfc;padding:15px;border-radius:8px;margin-top:10px}#np .pickrow{width:100%;justify-content:flex-start;margin:6px 0;font-size:12px;text-align:left;overflow-wrap:anywhere}#np .pickhead{font-size:12px;color:#737b88;margin-bottom:10px}#np .detail{max-width:630px;padding:40px 30px;margin:0 auto}#np .detail-summary{font-size:14px;line-height:1.9;margin:22px 0 31px;color:#68717d;white-space:pre-wrap;overflow-wrap:anywhere}#np .detail-path{border-top:1px solid var(--np-border);padding-top:22px;margin-top:22px;font-size:12px;color:#737b88}#np .detail-path div{margin-top:8px;overflow-wrap:anywhere;color:#404a58}#np .empty-chapters{border:1px solid var(--np-border);border-radius:8px;padding:21px;margin-top:30px;color:#979ca5;font-size:13px}#np .bottom-status{border-top:1px solid var(--np-border);padding:8px 15px;color:#979ca5;font-size:11px;background:#fff}#np[data-collapsed=true] .layout{grid-template-columns:minmax(0,1fr)}#np[data-collapsed=true] .sidebar{display:none}#np .mobile-brand{display:none}
@media(max-width:760px){#np .layout{grid-template-columns:155px minmax(0,1fr)}#np .grid{grid-template-columns:minmax(0,1fr)}#np .formwrap{padding:31px 24px}#np .header{padding:15px 22px}#np .brandname{font-size:12px}#np .build{font-size:8px}#np .library{padding:25px 23px}#np .sessionname{padding-left:13px}}
@media(max-width:520px){#np .layout{display:block;min-height:0}#np .sidebar{padding:12px;border-right:0;border-bottom:1px solid var(--np-border)}#np .brand{padding-bottom:10px}#np .brandname{font-size:14px}#np .build,#np .new-session,#np .workspace-title,#np .foldername,#np .sessionname,#np .settings,#np .sidebar>.navitem:not(.selected){display:none}#np button.navitem{padding:7px 9px}#np .header{padding:13px 17px;min-height:56px}#np .formwrap{padding:27px 19px}#np .library{padding:24px 18px}#np .pathcontrol{flex-wrap:wrap}#np .pathcontrol .pathvalue{flex:1 1 150px}#np .pathcontrol button{margin-left:auto}#np .grid{gap:14px}#np h1{font-size:21px}#np .detail{padding:28px 20px}#np .pickrow{font-size:11px}#np button{min-height:38px}}
</style>
<div id="np" aria-label="沿用当前 DSH 风格的小说项目模块" data-collapsed="false">
  <div class="layout">
    <aside class="sidebar" aria-label="应用侧栏">
      <div class="brand"><div><div class="brandname">DSH 本地构建</div><span class="build">local development</span></div><button type="button" class="ghost cursor-interaction" data-action="collapse" aria-label="收起侧栏"><i data-lucide="panel-left" aria-hidden="true"></i></button></div>
      <div class="new-session"><i data-lucide="circle-plus" aria-hidden="true"></i>新会话</div>
      <div class="navitem"><i data-lucide="panels-top-left" aria-hidden="true"></i>漫剧</div>
      <button type="button" class="navitem selected cursor-interaction" data-action="library" aria-current="page"><i data-lucide="book-open" aria-hidden="true"></i>小说</button>
      <div class="workspace-title"><span>工作区</span><div class="row"><i data-lucide="search" aria-hidden="true"></i><i data-lucide="sliders-horizontal" aria-hidden="true"></i><i data-lucide="folder-plus" aria-hidden="true"></i></div></div>
      <div class="foldername"><i data-lucide="folder" aria-hidden="true"></i>漫剧</div><div class="sessionname"><span>询问模型身份</span><span>5天</span></div>
      <div class="settings"><div class="navitem"><i data-lucide="settings" aria-hidden="true"></i>设置</div></div>
    </aside>
    <section class="main" aria-label="小说项目"><header class="header" id="np-header"></header><main id="np-content"></main></section>
  </div><div class="bottom-status" id="np-status" role="status" aria-live="polite">界面原型 · 文件夹选择为演示，不会读写本地文件</div>
</div>
<script>
(()=>{
const root=document.getElementById('np'),header=root.querySelector('#np-header'),content=root.querySelector('#np-content');
const base='/Users/jake/Documents/小说';
const seed=[{id:'rain',title:'雨夜来信',intro:'一封没有署名的信，将城南的年轻调查者卷入一桩跨越十年的失踪案。',path:base+'/雨夜来信',updated:'今天',chapters:12},{id:'star',title:'第七行星',intro:'在一颗被遗忘的殖民星球上，一位维修师发现每个人的记忆都被悄悄修改过。',path:base+'/第七行星',updated:'昨天',chapters:6},{id:'summer',title:'夏日未完',intro:'多年后重逢的两个人，决定一起完成十八岁那年没能实现的旅行。',path:base+'/夏日未完',updated:'3 天前',chapters:0}];
const state={view:'create',title:'',intro:'',folder:'',picker:false,importing:false,selected:null,notice:'',error:'',collapsed:false,projects:seed.map(x=>({...x}))};
let savedSnapshot='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(label,action,primary=false,icon='')=>`<button type="button" class="${primary?'primary ':''}cursor-interaction" data-action="${action}">${icon?`<i data-lucide="${icon}" aria-hidden="true"></i>`:''}${label}</button>`;
function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}})}
function restore(saved){const p=saved&&saved.privateContent;if(!p||p.version!==1)return;const d=p.draft||{};for(const k of ['title','intro','folder'])if(typeof d[k]==='string')state[k]=d[k].slice(0,k==='intro'?2000:300);if(['create','library','detail'].includes(p.view))state.view=p.view;if(Array.isArray(p.projects)&&p.projects.length<=12){const valid=p.projects.filter(x=>x&&typeof x.id==='string'&&typeof x.title==='string'&&typeof x.intro==='string'&&typeof x.path==='string');if(valid.length===p.projects.length)state.projects=valid}if(typeof p.selected==='string')state.selected=p.selected;if(state.view==='detail'&&!state.projects.some(p=>p.id===state.selected))state.view='library'}
function persist(){const api=window.openai;if(!api||typeof api.setWidgetState!=='function')return;const privateContent={version:1,view:state.view,draft:{title:state.title,intro:state.intro,folder:state.folder},projects:state.projects.slice(0,8),selected:state.selected};while(new TextEncoder().encode(JSON.stringify(privateContent)).length>14000&&privateContent.projects.length)privateContent.projects.pop();savedSnapshot=JSON.stringify(privateContent);api.setWidgetState({modelContent:{module:'小说项目',view:state.view,projectCount:state.projects.length,creationFields:['作品名','小说简介','小说存放文件夹']},privateContent}).catch(()=>{})}
function setStatus(t){root.querySelector('#np-status').textContent=t}
function dirname(){return state.title.trim().replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_').replace(/[. ]+$/,'')||'作品名'}
function target(){return state.folder.replace(/\/$/,'')+'/'+dirname()}
function head(){root.dataset.collapsed=String(state.collapsed);let crumb=state.view==='create'?'创建小说':state.view==='detail'?(state.projects.find(x=>x.id===state.selected)?.title||'作品'):'全部作品';header.innerHTML=`<div class="crumb">${state.collapsed?'<button type="button" class="ghost cursor-interaction" data-action="collapse" aria-label="展开侧栏"><i data-lucide="panel-left" aria-hidden="true"></i></button>':''}<button type="button" class="ghost cursor-interaction" data-action="library">小说</button><span class="sep">/</span><span>${esc(crumb)}</span></div>${state.view==='library'?`<div class="row">${button('导入','import',false,'folder-input')}${button('创建小说','new',true,'plus')}</div>`:'<span class="prototype">界面示意</span>'}`}
function form(){content.innerHTML=`<div class="formwrap"><h1>创建小说</h1><p class="intro">创建一部作品，开始你的小说创作。</p><form id="np-form"><label class="field"><span class="field-label">作品名</span><input id="np-title" name="title" required maxlength="80" autocomplete="off" placeholder="输入作品名" value="${esc(state.title)}"></label><label class="field"><span class="field-label">小说简介</span><textarea id="np-intro" name="intro" required maxlength="2000" placeholder="简单介绍你想写的故事">${esc(state.intro)}</textarea></label><div class="field"><label class="field-label" id="np-folder-label">小说存放文件夹</label><div class="pathcontrol"><i data-lucide="folder" aria-hidden="true"></i><span class="pathvalue ${state.folder?'':'muted'}" id="np-folder-value">${state.folder?esc(state.folder):'请选择存放位置'}</span><button type="button" class="cursor-interaction" data-action="choose" aria-labelledby="np-folder-label np-picktext"><span id="np-picktext">${state.folder?'更改':'选择文件夹'}</span></button></div><div id="np-picker">${state.picker?picker(false):''}</div><p class="helper">将在所选文件夹内，为这部小说创建一个独立目录。</p><div id="np-destination" class="destination" ${state.folder?'':'hidden'}><div>作品保存位置</div><strong id="np-target">${state.folder?esc(target()):''}</strong></div></div><p class="error" id="np-error" role="alert" ${state.error?'':'hidden'}>${esc(state.error)}</p><div class="actions">${button('取消','library')}<button type="button" data-action="create" class="primary cursor-interaction" id="np-submit" ${valid()?'':'disabled'}>创建小说</button></div></form></div>`;content.querySelector('#np-form').addEventListener('submit',e=>{e.preventDefault();create()})}
function valid(){return Boolean(state.title.trim()&&state.intro.trim()&&state.folder)}
function picker(importing){if(importing)return `<div class="pickbox"><div class="row between"><span class="pickhead">选择已有小说目录 · 演示</span>${button('取消','cancel-import')}</div><button type="button" class="pickrow cursor-interaction" data-import-path="${esc(base+'/山海旧闻')}"><i data-lucide="folder" aria-hidden="true"></i><span>${esc(base+'/山海旧闻')}</span></button><p class="small muted">识别作品信息并加入列表，原目录保持不变。</p></div>`;return `<div class="pickbox"><div class="pickhead">选择存放文件夹 · 演示</div>${[base,'/Users/jake/Documents/写作项目'].map(p=>`<button type="button" class="pickrow cursor-interaction" data-folder="${esc(p)}"><i data-lucide="folder" aria-hidden="true"></i>${esc(p)}</button>`).join('')}</div>`}
function library(){content.innerHTML=`<div class="library">${state.notice?`<div class="success"><i data-lucide="circle-check" aria-hidden="true"></i>${esc(state.notice)}</div>`:''}<div class="library-title"><h1>我的小说</h1><span class="small muted">${state.projects.length} 部作品</span></div>${state.importing?picker(true):''}<div class="grid" style="${state.importing?'margin-top:22px':''}">${state.projects.map(p=>`<article class="novelcard"><button type="button" class="cursor-interaction" data-open="${esc(p.id)}"><i data-lucide="book-open" aria-hidden="true"></i>${esc(p.title)}</button><p class="synopsis">${esc(p.intro.length>90?p.intro.slice(0,90)+'…':p.intro)}</p><div class="pathline"><i data-lucide="folder" aria-hidden="true"></i><span>${esc(p.path)}</span></div><div class="cardfoot"><span>${esc(p.updated||'刚刚')}更新 · ${Number(p.chapters)||0} 章</span><button type="button" class="cursor-interaction" data-open="${esc(p.id)}">打开作品 <i data-lucide="arrow-up-right" aria-hidden="true"></i></button></div></article>`).join('')}</div></div>`}
function detail(){const p=state.projects.find(x=>x.id===state.selected);if(!p){state.view='library';render();return}content.innerHTML=`<div class="detail"><div class="row between"><h1>${esc(p.title)}</h1><span class="small muted">${Number(p.chapters)||0} 章</span></div><p class="detail-summary">${esc(p.intro)}</p><div class="detail-path">小说文件夹<div class="row"><i data-lucide="folder" aria-hidden="true"></i>${esc(p.path)}</div></div><div class="empty-chapters">${Number(p.chapters)?'已打开作品项目。章节编辑将在后续模块中设计。':'作品已创建，还没有章节。'}</div><div class="actions">${button('返回小说列表','library')}</div></div>`}
function render(){head();({create:form,library,detail}[state.view]||form)();icons()}
function updateForm(){const b=root.querySelector('#np-submit');if(b)b.disabled=!valid();const targetEl=root.querySelector('#np-target');if(targetEl)targetEl.textContent=state.folder?target():'';state.error='';const errorEl=root.querySelector('#np-error');if(errorEl){errorEl.hidden=true;errorEl.textContent=''}}
function fail(message){state.error=message;const el=root.querySelector('#np-error');el.hidden=false;el.textContent=message}
function create(){if(!valid()){fail('请填写作品名、小说简介，并选择存放文件夹。');return}if(!dirname()||['.','..'].includes(state.title.trim())){fail('请使用有效的作品名。');return}if(state.projects.some(p=>p.path===target())){fail('该位置已有同名小说目录，请修改作品名或更换存放文件夹。');return}if(state.projects.length>=8){fail('演示最多保留 8 部作品。');return}const id='novel-'+Date.now();state.projects.unshift({id,title:state.title.trim(),intro:state.intro.trim(),path:target(),updated:'刚刚',chapters:0});state.selected=id;state.notice='“'+state.title.trim()+'”已创建';state.view='library';state.picker=false;state.importing=false;render();setStatus('创建流程演示完成 · 小说已加入列表，未实际创建本地目录');persist()}
root.addEventListener('input',e=>{if(e.target.id==='np-title')state.title=e.target.value;if(e.target.id==='np-intro')state.intro=e.target.value;updateForm()});
root.addEventListener('change',e=>{if(['np-title','np-intro'].includes(e.target.id))persist()});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;if(b.dataset.folder){state.folder=b.dataset.folder;state.picker=false;render();persist();return}if(b.dataset.open){state.selected=b.dataset.open;state.view='detail';render();persist();return}if(b.dataset.importPath){const path=b.dataset.importPath;let existing=state.projects.find(p=>p.path===path);if(!existing){existing={id:'import-shanhai',title:'山海旧闻',intro:'一位记录异闻的旅人，在山川与城镇之间寻找失落的故乡。',path,updated:'刚刚',chapters:3};state.projects.unshift(existing)}state.notice='已导入“'+existing.title+'”';state.importing=false;render();setStatus('导入流程演示完成 · 未读取或移动真实文件');persist();return}switch(b.dataset.action){case'create':create();break;case'library':state.view='library';state.picker=false;state.importing=false;render();persist();break;case'new':state.view='create';state.title='';state.intro='';state.folder='';state.error='';state.notice='';render();persist();break;case'choose':state.picker=!state.picker;render();break;case'import':state.importing=true;state.notice='';render();break;case'cancel-import':state.importing=false;render();break;case'collapse':state.collapsed=!state.collapsed;head();icons();break}});
restore(window.openai&&window.openai.widgetState);render();window.addEventListener('openai:set_globals',e=>{const g=e.detail&&e.detail.globals;if(g&&Object.prototype.hasOwnProperty.call(g,'widgetState')){if(JSON.stringify(g.widgetState&&g.widgetState.privateContent)===savedSnapshot)return;restore(g.widgetState);render()}});
})();
</script>
